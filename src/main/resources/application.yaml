spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  application:
    name: SpringAI

  # docker run -d --name pgvector   -e POSTGRES_USER=postgres  -e POSTGRES_PASSWORD=postgres  -e POSTGRES_DB=springai  -p 5432:5432 pgvector/pgvector:pg17
  # psql -U postgres -d springai
  #\dx
  # CREATE EXTENSION IF NOT EXISTS vector;
  # \dt List of relations
  datasource:
    url: jdbc:postgresql://localhost:5422/springai
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate

  # Timeouts for the auto-configured RestClient/WebClient (used by Ollama API).
  # Local models with tool calling + big context are slow, so keep read-timeout generous.
  http:
    client:
      connect-timeout: 30s
      read-timeout: 600s

  ai:
    openai:
      api-key: temp-key
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: nomic-embed-text
    retry:
      max-attempts: 3
      on-client-errors: false
    vectorstore:
      pgvector:
        initialize-schema: true
        remove-existing-vector-store-table: true
        dimensions: 768
        distance-type: COSINE_DISTANCE

app:
  tools:
    file-output-dir: ./agent-output
    web-search:
      url:
      api-key:
      max-calls-per-question: 2

logging:
  level:
    # ===== OLLAMA =====
    org.springframework.ai.ollama: DEBUG
    org.springframework.ai.ollama.api: DEBUG
    org.springframework.ai.ollama.chat: DEBUG

    # ===== VECTOR STORE =====
    org.springframework.ai.vectorstore.pgvector: DEBUG
    org.springframework.ai.vectorstore: DEBUG

    # ===== RAW HTTP TO OLLAMA =====
    org.springframework.web.reactive.function.client: DEBUG
    reactor.netty.http.client: INFO

    # ===== DATABASE SQL WITH VALUES =====
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG

    # ===== MCP CLIENT =====
    io.modelcontextprotocol: DEBUG
    io.modelcontextprotocol.client: INFO
    io.modelcontextprotocol.client.transport: WARN
jasypt:
  encryptor:
    #password: ${jasypt.encryptor.password}
